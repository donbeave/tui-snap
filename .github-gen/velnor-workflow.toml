schema = 2

[generator]
repository = "donbeave/tui-snap"
revision = "be61acbbbfb71db6b51337e547e39de049d4fc15"

# Public repo: GitHub-hosted singleton (no velnor lanes).
# No external DCO declared: the DCO app has not posted on this repo
# (runbook §2 guardrail — declaring an uncovered context fails Policy).
# vendor/ excluded by evidence: vendor/termlens is standalone (no
# workspace membership, no lockfile), so `cargo --locked` run from
# that dir fails; it still compiles as a path dependency of the root
# unit. tools/*.py carry no project markers, so the scan derives no
# unit from them and no exclude is needed.
[scan]
exclude = ["vendor/**"]

[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
